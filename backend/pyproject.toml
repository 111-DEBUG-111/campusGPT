[project]
name = "campusgpt-backend"
version = "0.1.0"
description = "CampusGPT RAG Backend"
requires-python = ">=3.11"

[project.dependencies]
fastapi = ">=0.111.0"
uvicorn = {extras = ["standard"], version = ">=0.29.0"}
pydantic = ">=2.7.0"
pydantic-settings = ">=2.3.0"
python-multipart = ">=0.0.9"
httpx = ">=0.27.0"

# Google Gemini
google-generativeai = ">=0.7.0"

# Embeddings + Reranker
FlagEmbedding = ">=1.2.10"
sentence-transformers = ">=3.0.0"

# Vector DB — pgvector on Neon PostgreSQL via asyncpg (no extra client package needed)
# asyncpg is listed below under Database drivers

# BM25
rank-bm25 = ">=0.2.2"

# PDF parsing
pymupdf = ">=1.24.0"
pdfplumber = ">=0.11.0"

# Database
sqlalchemy = ">=2.0.0"
# Database drivers
asyncpg = ">=0.29.0"   # async PostgreSQL (Neon + pgvector)
# aiosqlite kept for local dev/test fallback; asyncpg used for Neon
aiosqlite = ">=0.20.0"
greenlet = ">=3.0.0"

# Rate limiting
slowapi = ">=0.1.9"

# Utilities
python-dotenv = ">=1.0.0"
aiofiles = ">=23.2.0"
transformers = "<5.0.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
