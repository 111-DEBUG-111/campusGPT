[project]
name = "campusgpt-backend"
version = "0.1.0"
description = "CampusGPT RAG Backend"
requires-python = ">=3.11"
dependencies = [
    # API framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",

    # Google Gemini
    "google-generativeai>=0.7.0",

    # Embeddings + Reranker
    "FlagEmbedding>=1.2.10",
    "sentence-transformers>=3.0.0",

    # BM25
    "rank-bm25>=0.2.2",

    # PDF parsing
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",

    # Database (Neon PostgreSQL via asyncpg)
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",  # local dev / test fallback
    "greenlet>=3.0.0",

    # Rate limiting
    "slowapi>=0.1.9",
    "redis>=4.2.0",  # required by slowapi for Redis-backed rate-limit storage

    # Object storage (Supabase S3-compatible)
    "aioboto3>=13.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.0",
    "psutil>=5.9.0",
    "nltk>=3.8.0",

    # HuggingFace Transformers (pinned below 5 to avoid breaking API changes)
    "transformers<5.0.0",

    # Response cache (Upstash Redis REST client)
    "upstash-redis>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
