services:
  - type: web
    name: campusgpt-api
    runtime: python
    rootDir: backend
    # uv is 10-40x faster than pip and installs from the pinned lock file —
    # no dependency resolver needed, every version is already exact.
    # To regenerate the lock after changing pyproject.toml:
    #   cd backend && uv pip compile pyproject.toml --python-version 3.11 --output-file requirements.lock
    buildCommand: pip install uv && uv pip install --system -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 75 --log-level info
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # ─── Upstash Redis ────────────────────────────────────────────────────────
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_TOKEN
        sync: false
      # ─── Neon PostgreSQL ──────────────────────────────────────────────────────
      # Format: postgresql+asyncpg://user:pass@host/db
      - key: DATABASE_URL
        sync: false
      # ─── Supabase Storage (S3-compatible) ───────────────────────────────────
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_BUCKET_NAME
        value: campusgpt-uploads
      # ─── Static config ────────────────────────────────────────────────────────
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: RERANKER_MODEL
        value: BAAI/bge-reranker-base
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: DEBUG
        value: "false"
