services:
  - type: web
    name: campusgpt-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # ─── Neon PostgreSQL ──────────────────────────────────────────────────────
      # Format: postgresql+asyncpg://user:pass@host/db?ssl=true
      - key: DATABASE_URL
        sync: false
      # ─── Supabase Storage (S3-compatible) ───────────────────────────────────
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_BUCKET_NAME
        value: campusgpt-uploads
      # ─── Static config ────────────────────────────────────────────────────────
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: RERANKER_MODEL
        value: BAAI/bge-reranker-base
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: DEBUG
        value: "false"
